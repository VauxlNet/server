services:
  vauxl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    network_mode: "host" # Für lokales SQLx Migrate
    environment:
      VAUXL_DATABASE__URL: postgres://vauxl:vauxl@127.0.0.1/vauxl?sslmode=disable
      VAUXL_REDIS__URL: redis://127.0.0.1:6379
      RUST_LOG: vauxl_server=trace,tower_http=trace,sqlx=trace,axum=trace
    volumes:
      - vauxl_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:16-alpine
    network_mode: "host"
    environment:
      POSTGRES_USER: vauxl
      POSTGRES_PASSWORD: vauxl
      POSTGRES_DB: vauxl
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vauxl"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    network_mode: "host"

volumes:
  pgdata: {}
  vauxl_data: {}
