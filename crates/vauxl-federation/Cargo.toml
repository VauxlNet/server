[package]
name    = "vauxl-federation"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json    = { workspace = true }
reqwest       = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
redis         = { version = "0.27", features = ["tokio-comp"] }
ed25519-dalek = "2"
base64        = "0.22"
